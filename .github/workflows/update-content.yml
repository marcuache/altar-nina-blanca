name: Actualizar Contenido Automático

on:
  schedule:
    # Se ejecuta automáticamente todos los lunes a las 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generar nuevas frases y lecturas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-content.mjs

      - name: Guardar cambios en content/contenido.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/contenido.json
          git diff --staged --quiet || git commit -m "chore: actualizar contenido semanal del altar"
          git push
